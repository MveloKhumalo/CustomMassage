<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Blossom & Sweet Notes</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blush: '#fff0f5',
                        rosepink: '#ffb6c1',
                        deeprose: '#ff69b4',
                        softmagenta: '#e05297',
                        sparklepink: '#ffd1dc',
                        goldaccent: '#f7d070'
                    },
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        dancing: ['Dancing Script', 'cursive'],
                        sacramento: ['Sacramento', 'cursive']
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe6ee 0%, #ffc0cb 50%, #ffd1dc 100%);
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        /* Custom Glassmorphism Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(230, 80, 135, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.9);
        }

        /* Pulsing Soft Glow Animation */
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 15px 35px rgba(255, 105, 180, 0.3), 0 0 25px rgba(255, 182, 193, 0.5);
            }
            50% {
                box-shadow: 0 20px 50px rgba(255, 105, 180, 0.55), 0 0 45px rgba(255, 192, 203, 0.8);
            }
        }

        .glow-active {
            animation: pulseGlow 4s infinite ease-in-out;
        }

        /* Canvas Fullscreen background */
        #petalCanvas, #sparkleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #sparkleCanvas {
            z-index: 20;
        }

        /* Custom Scrollbar for Message Box */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffb6c1;
            border-radius: 10px;
        }

        /* Floating interactive flowers around edges */
        .interactive-flower {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
            cursor: pointer;
        }
        .interactive-flower:hover {
            transform: scale(1.3) rotate(20deg);
            filter: drop-shadow(0 0 12px rgba(255, 105, 180, 0.8));
        }

        /* Heart sparkle keyframes */
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-80px) scale(1.4) rotate(25deg);
            }
        }

        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative p-4 sm:p-6 overflow-y-auto">

    <!-- Petals and Sparkles Background Canvases -->
    <canvas id="petalCanvas"></canvas>
    <canvas id="sparkleCanvas"></canvas>

    <!-- Interactive Floral Corner Decorations -->
    <div class="fixed top-4 left-4 z-30 text-rosepink text-4xl sm:text-5xl interactive-flower opacity-80 hover:opacity-100" title="Click me for magic!" onclick="spawnFlowerBurst(event)">
        🌸
    </div>
    <div class="fixed top-4 right-4 z-30 text-rosepink text-4xl sm:text-5xl interactive-flower opacity-80 hover:opacity-100" title="Click me for magic!" onclick="spawnFlowerBurst(event)">
        🌺
    </div>
    <div class="fixed bottom-4 left-4 z-30 text-rosepink text-4xl sm:text-5xl interactive-flower opacity-80 hover:opacity-100" title="Click me for magic!" onclick="spawnFlowerBurst(event)">
        🌷
    </div>
    <div class="fixed bottom-4 right-4 z-30 text-rosepink text-4xl sm:text-5xl interactive-flower opacity-80 hover:opacity-100" title="Click me for magic!" onclick="spawnFlowerBurst(event)">
        🌸
    </div>

    <!-- Main Interactive Central Card Component -->
    <main class="relative z-20 w-full max-w-lg glass-card rounded-3xl p-6 sm:p-8 text-center glow-active transition-all duration-500 my-auto">
        
        <!-- Header Ribbons & Icons -->
        <div class="flex justify-between items-center mb-4">
            <button id="soundToggle" onclick="toggleMusic()" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/70 hover:bg-white text-pink-600 text-xs font-semibold shadow-sm transition-all transform active:scale-95" title="Play or pause the song" aria-label="Play or pause the song" aria-pressed="false">
                <i id="soundIcon" class="fa-solid fa-volume-xmark"></i>
                <span id="soundText">Sound Off</span>
            </button>

            <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-pink-100 text-pink-500 shadow-inner">
                <i class="fa-solid fa-heart animate-pulse text-lg"></i>
            </div>
            
            <!-- 
            <button onclick="toggleCustomModal()" class="px-3 py-1.5 rounded-full bg-white/70 hover:bg-white text-pink-600 text-xs font-semibold shadow-sm transition-all transform active:scale-95" title="Edit Custom Note">
                <i class="fa-solid fa-pen-to-square"></i> Custom
            </button>
            -->
        </div>

        <!-- YouTube player appears after Sound Off is clicked. -->
        <section id="musicPanel" class="hidden mb-5 p-3 bg-white/60 rounded-2xl border border-pink-100 shadow-inner" aria-label="Song player">
            <div class="flex items-center justify-between gap-2 mb-2 text-xs text-pink-700">
                <span class="font-semibold"><i class="fa-solid fa-music mr-1"></i> Your song</span>
                <a href="https://music.youtube.com/watch?v=hfgqRzhPROg" target="_blank" rel="noopener noreferrer" class="underline hover:text-pink-900">Open in YouTube Music ↗</a>
            </div>
            <div id="youtube-player" class="w-full overflow-hidden rounded-xl bg-pink-100" style="min-height: 210px;"></div>
            <p id="musicStatus" class="mt-2 text-xs text-pink-700" role="status">Loading the song…</p>
        </section>

        <!-- Decorative Card Header -->
        <div class="mb-2">
            <span class="inline-block px-4 py-1 rounded-full text-xs font-medium bg-pink-200/60 text-pink-700 tracking-wider uppercase mb-2">
                ✨ Just For You ✨
            </span>
            <h1 class="font-sacramento text-4xl sm:text-5xl font-bold text-pink-600 drop-shadow-sm">
                Sweet Thoughts
            </h1>
        </div>

        <!-- Center Interactive Flower Accent -->
        <div class="my-4 relative inline-block">
            <div id="centerFlower" onclick="burstHearts(event)" class="text-6xl sm:text-7xl cursor-pointer transition-transform duration-300 hover:scale-125 hover:rotate-12 select-none inline-block filter drop-shadow-md" title="Click for love burst!">
                🌷
            </div>
            <span class="absolute -bottom-1 left-1/2 -translate-x-1/2 text-[10px] bg-pink-500 text-white font-medium px-2 py-0.5 rounded-full shadow-sm opacity-90 whitespace-nowrap">Tap me!</span>
        </div>

        <!-- Message Display Area -->
        <div class="bg-white/60 backdrop-blur-sm rounded-2xl p-5 sm:p-6 mb-6 shadow-inner border border-pink-100/80 min-h-[140px] flex items-center justify-center relative group">
            <p id="messageText" class="font-dancing text-2xl sm:text-3xl text-pink-800 leading-relaxed font-semibold transition-opacity duration-300">
                "I don't want a perfect life, I just want a life with you in it. Will you be mine forever? Mavuso?"
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-3 justify-center items-center">
            <!--
            <button onclick="nextMessage()" class="">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Next Note</span>
            </button>
            -->
            <button onclick="copyMessage()" class="w-full sm:w-auto flex-1 bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-medium py-3 px-6 rounded-2xl shadow-lg hover:shadow-pink-300/50 transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                <i class="fa-solid fa-copy"></i>
                <span>Copy</span>
            </button>
        </div>

        <!-- Footer Tag -->
        <p class="text-xs text-pink-400/80 mt-6 font-light">
            Made with 💕 &amp; endless pink petals
        </p>
    </main>

    <!-- Custom Text Modal -->
    <div id="customModal" class="fixed inset-0 bg-pink-900/40 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white/90 glass-card rounded-3xl p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-300" id="modalBox">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-poppins text-lg font-semibold text-pink-700 flex items-center gap-2">
                    <i class="fa-solid fa-heart-circle-plus text-pink-500"></i> Write Your Own Note
                </h3>
                <button onclick="toggleCustomModal()" class="text-pink-400 hover:text-pink-600 text-xl font-bold p-1">
                    &times;
                </button>
            </div>
            <textarea id="customInput" rows="4" class="w-full p-4 rounded-xl border border-pink-200 focus:ring-2 focus:ring-pink-400 focus:outline-none text-pink-800 placeholder-pink-300 bg-white/80 resize-none font-poppins text-sm mb-4" placeholder="Type your sweet note here..."></textarea>
            <div class="flex gap-3 justify-end">
                <button onclick="toggleCustomModal()" class="px-4 py-2 rounded-xl bg-pink-100 text-pink-600 font-medium text-sm hover:bg-pink-200 transition-colors">
                    Cancel
                </button>
                <button onclick="saveCustomMessage()" class="px-5 py-2 rounded-xl bg-pink-500 hover:bg-pink-600 text-white font-medium text-sm shadow-md transition-colors">
                    Apply Note
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-pink-600 text-white text-xs font-medium px-5 py-2.5 rounded-full shadow-xl z-50 opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMsg">Copied to clipboard!</span>
    </div>

    <script>
        /* Preset Uplifting / Loving Messages */
        const messages = [
            "Custom message will be here"
        ];

        let currentMsgIndex = 0;

        /* DOM Elements */
        const messageText = document.getElementById('messageText');
        const customModal = document.getElementById('customModal');
        const modalBox = document.getElementById('modalBox');
        const customInput = document.getElementById('customInput');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        /* Switch Message with Fade Animation */
        function nextMessage() {
            messageText.classList.add('opacity-0');
            setTimeout(() => {
                currentMsgIndex = (currentMsgIndex + 1) % messages.length;
                messageText.textContent = `"${messages[currentMsgIndex]}"`;
                messageText.classList.remove('opacity-0');
            }, 300);
        }

        /* Copy Current Message to Clipboard */
        function copyMessage() {
            const textToCopy = messageText.textContent.replace(/^"|"$/g, '');
            
            // Clipboard fallback strategy for browser security contexts
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("Note copied to clipboard! 💕");
            } catch (err) {
                showToast("Failed to copy note.");
            }
            document.body.removeChild(textarea);
        }

        /* Show Floating Toast Notification */
        function showToast(text) {
            toastMsg.textContent = text;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }

        /* Custom Message Modal Handler */
        function toggleCustomModal() {
            const isHidden = customModal.classList.contains('opacity-0');
            if (isHidden) {
                customModal.classList.remove('opacity-0', 'pointer-events-none');
                modalBox.classList.remove('scale-95');
                modalBox.classList.add('scale-100');
                customInput.value = messageText.textContent.replace(/^"|"$/g, '');
                customInput.focus();
            } else {
                customModal.classList.add('opacity-0', 'pointer-events-none');
                modalBox.classList.remove('scale-100');
                modalBox.classList.add('scale-95');
            }
        }

        /* Save Custom Note */
        function saveCustomMessage() {
            const val = customInput.value.trim();
            if (val) {
                messageText.classList.add('opacity-0');
                setTimeout(() => {
                    messageText.textContent = `"${val}"`;
                    messageText.classList.remove('opacity-0');
                }, 300);
                toggleCustomModal();
                showToast("Custom note applied! ✨");
            }
        }
        
        /* YouTube IFrame API: play the linked song instead of ambient chimes. */
        const MUSIC_VIDEO_ID = 'hfgqRzhPROg';
        let musicPlayer = null;
        let playerReady = false;
        let youtubeApiReady = false;
        let wantsMusic = false;

        const musicPanel = document.getElementById('musicPanel');
        const musicStatus = document.getElementById('musicStatus');
        const soundToggle = document.getElementById('soundToggle');
        const soundIcon = document.getElementById('soundIcon');
        const soundText = document.getElementById('soundText');

        function setSoundButton(state) {
            const playing = state === 'playing';
            soundIcon.className = playing ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
            soundText.textContent = state === 'loading' ? 'Loading…' : playing ? 'Sound On' : 'Sound Off';
            soundToggle.setAttribute('aria-pressed', String(playing));
        }

        function onYouTubeIframeAPIReady() {
            youtubeApiReady = true;
            if (wantsMusic) initializeSongPlayer();
        }

        function initializeSongPlayer() {
            if (musicPlayer || !youtubeApiReady) return;

            musicPlayer = new YT.Player('youtube-player', {
                height: '220',
                width: '100%',
                videoId: MUSIC_VIDEO_ID,
                playerVars: {
                    autoplay: 1,  // Player is only created after a deliberate button click.
                    playsinline: 1,
                    controls: 1,
                    rel: 0
                },
                events: {
                    onReady: (event) => {
                        playerReady = true;
                        if (wantsMusic) {
                            event.target.unMute();
                            event.target.playVideo();
                            musicStatus.textContent = 'If playback does not start, press Play in the video above.';
                        }
                    },
                    onStateChange: (event) => {
                        if (event.data === YT.PlayerState.PLAYING) {
                            wantsMusic = true;
                            musicPanel.classList.remove('hidden');
                            setSoundButton('playing');
                            musicStatus.textContent = 'Music playing 💕';
                        } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                            wantsMusic = false;
                            setSoundButton('off');
                            musicStatus.textContent = 'Paused — press Play or Sound Off to continue.';
                        }
                    },
                    onError: () => {
                        wantsMusic = false;
                        setSoundButton('off');
                        musicStatus.textContent = 'This video cannot be played here. Use “Open in YouTube Music” above.';
                        showToast('Please open the song in YouTube Music.');
                    }
                }
            });
        }

        function toggleMusic() {
            if (wantsMusic) {
                wantsMusic = false;
                if (playerReady) musicPlayer.pauseVideo();
                musicPanel.classList.add('hidden');
                setSoundButton('off');
            } else {
                wantsMusic = true;
                musicPanel.classList.remove('hidden');
                setSoundButton('loading');
                musicStatus.textContent = 'Loading the song…';

                if (playerReady) {
                    musicPlayer.unMute();
                    musicPlayer.playVideo();
                } else if (youtubeApiReady) {
                    initializeSongPlayer();
                }
            }
        }

        // Load the API in advance, but do not autoplay until Sound Off is clicked.
        const youtubeScript = document.createElement('script');
        youtubeScript.src = 'https://www.youtube.com/iframe_api';
        youtubeScript.onerror = () => {
            setSoundButton('off');
            musicStatus.textContent = 'Could not load YouTube. Use the YouTube Music link above.';
        };
        document.head.appendChild(youtubeScript);

        /* Heart Burst Physics Effect on Click */
        function burstHearts(e) {
            const rect = e.target.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            const emojis = ['💖', '💕', '🌸', '✨', '🌺', '💌'];

            for (let i = 0; i < 14; i++) {
                const p = document.createElement('div');
                p.className = 'heart-particle select-none';
                p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.fontSize = `${Math.random() * 16 + 18}px`;
                p.style.left = `${centerX}px`;
                p.style.top = `${centerY}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 90 + 30;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 50;

                p.style.setProperty('--tx', `${tx}px`);
                p.style.setProperty('--ty', `${ty}px`);
                p.style.transform = `translate(0, 0)`;

                document.body.appendChild(p);

                p.animate([
                    { transform: 'translate(0,0) scale(0.5)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(1.3)`, opacity: 0 }
                ], {
                    duration: 1200 + Math.random() * 400,
                    easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)',
                    fill: 'forwards'
                });

                setTimeout(() => p.remove(), 1600);
            }
        }

        function spawnFlowerBurst(e) {
            burstHearts(e);
        }

        const canvas = document.getElementById('petalCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Petal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 10 + 8;
                this.speedY = Math.random() * 1.2 + 0.8;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 1.5;
                this.opacity = Math.random() * 0.5 + 0.4;
                this.color = Math.random() > 0.4 ? '#ffb6c1' : (Math.random() > 0.5 ? '#ffc0cb' : '#ffe4e1');
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.rotation += this.rotSpeed;

                if (this.y > height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;

                // Draw delicate petal shape using bezier curves
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size, 0, this.size * 1.5);
                ctx.bezierCurveTo(this.size, this.size, this.size, -this.size / 2, 0, 0);
                ctx.fill();
                ctx.restore();
            }
        }

        const petals = Array.from({ length: 45 }, () => new Petal());

        const sCanvas = document.getElementById('sparkleCanvas');
        const sCtx = sCanvas.getContext('2d');
        sCanvas.width = window.innerWidth;
        sCanvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            sCanvas.width = window.innerWidth;
            sCanvas.height = window.innerHeight;
        });

        const sparkles = [];

        class Sparkle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5 - 0.5;
                this.life = 1;
                this.decay = Math.random() * 0.03 + 0.015;
                this.color = Math.random() > 0.3 ? '#fff' : '#f7d070';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= this.decay;
            }

            draw() {
                sCtx.save();
                sCtx.globalAlpha = Math.max(0, this.life);
                sCtx.fillStyle = this.color;
                sCtx.beginPath();
                sCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                sCtx.fill();
                sCtx.restore();
            }
        }

        window.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.4) {
                sparkles.push(new Sparkle(e.clientX, e.clientY));
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0 && Math.random() > 0.3) {
                sparkles.push(new Sparkle(e.touches[0].clientX, e.touches[0].clientY));
            }
        });

        function animate() {
            // Clear petals canvas
            ctx.clearRect(0, 0, width, height);
            petals.forEach(p => {
                p.update();
                p.draw();
            });

            // Clear sparkles canvas
            sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
            for (let i = sparkles.length - 1; i >= 0; i--) {
                sparkles[i].update();
                sparkles[i].draw();
                if (sparkles[i].life <= 0) {
                    sparkles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
